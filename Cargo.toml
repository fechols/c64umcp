[package]
name = "c64umcp"
version = "0.1.0"
edition = "2024"
description = "A local MCP server for Commodore 64 Ultimate devices"
rust-version = "1.88"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
rmcp = { version = "3.8", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
rmcp = { version = "3.8", features = ["client", "transport-child-process"] }
wiremock = "0.6"
